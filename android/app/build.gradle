plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace "com.music.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.sepotify.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPropsFile = rootProject.file("keystore.properties")
            if (ksPropsFile.exists()) {
                def ksProps = new Properties()
                ksPropsFile.withInputStream { ksProps.load(it) }
                def ks = file(ksProps.getProperty("storeFile", "sepotify-release.jks"))
                if (ks.exists()) {
                    storeFile ks
                    storePassword ksProps.getProperty("storePassword")
                    keyAlias ksProps.getProperty("keyAlias")
                    keyPassword ksProps.getProperty("keyPassword")
                }
            } else if (System.getenv("SEPOTIFY_KEYSTORE_PASS") != null) {
                def ks = file("sepotify-release.jks")
                if (ks.exists()) {
                    storeFile ks
                    storePassword System.getenv("SEPOTIFY_KEYSTORE_PASS")
                    keyAlias System.getenv("SEPOTIFY_KEY_ALIAS") ?: "sepotify"
                    keyPassword System.getenv("SEPOTIFY_KEY_PASS") ?: System.getenv("SEPOTIFY_KEYSTORE_PASS")
                }
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'

    // Haze (Blur & Liquid Glass)
    implementation 'dev.chrisbanes.haze:haze:1.0.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Media3 ExoPlayer & MediaSession
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-session:1.5.0'
    implementation 'androidx.media3:media3-common:1.5.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Palette (Dynamic Color Extraction from Album Art)
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // DataStore (Persistence)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Desugaring for NewPipeExtractor Java 8+ features
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // NewPipeExtractor (Pure on-device YouTube extraction)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
